<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHS Graduation Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fb;
      --ink: #1b2230;
      --panel: #ffffff;
      --accent: #2f4fa7;
      --accent-2: #1f7b74;
      --muted: #5a6479;
      --ring: rgba(47, 79, 167, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 8%, rgba(47, 79, 167, 0.2), transparent 36%),
        radial-gradient(circle at 8% 88%, rgba(31, 123, 116, 0.2), transparent 34%),
        linear-gradient(140deg, #f8f9fe, var(--bg));
      padding: 20px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--page-bg-image, none) center center / cover no-repeat;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

    .main {
      background: var(--panel);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 42px rgba(13, 18, 28, 0.12);
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .chip {
      border: 1px solid #d7def1;
      color: var(--ink);
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip:hover,
    .chip:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    h1 {
      margin: 8px 0 8px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 3.1vw, 2.4rem);
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.5;
    }

    .viewer-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #101420;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-wrap img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      display: block;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: rgba(12, 19, 35, 0.72);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .arrow:hover { background: rgba(12, 19, 35, 0.92); }

    .arrow.left { left: 10px; }
    .arrow.right { right: 10px; }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .counter {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: 1px solid #d7def1;
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .btn:hover,
    .btn:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    .btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .side {
      background: var(--panel);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 18px 42px rgba(13, 18, 28, 0.12);
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .side h2 {
      margin: 6px 0 10px;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow: auto;
      padding-right: 4px;
    }

    .thumb {
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      padding: 0;
      background: #d7def1;
      cursor: pointer;
      aspect-ratio: 1 / 1;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--ring);
    }

    .help {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.38);
      pointer-events: none;
      border-radius: 6px;
    }

    .thumb.video-thumb {
      position: relative;
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .thumbs {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }

      .main,
      .side { border-radius: 14px; }

      .thumbs {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="main">
      <nav class="top-nav" aria-label="Event navigation">
        <a class="chip" href="index.html">All People</a>
        <a class="chip" href="sridhruthi.html">Sridhruthi's Events</a>
        <a class="chip" href="bday11.html">← 11th Birthday</a>
        <a class="chip" href="kulturekool-2026.html">KultureKool 2026 →</a>
      </nav>

      <h1>CHS Graduation</h1>
      <p class="subtitle">Full-screen viewer, thumbnail rail, slideshow mode, and keyboard navigation.</p>

      <div class="viewer-wrap">
        <button class="arrow left" id="prevBtn" type="button" aria-label="Previous image">&#8249;</button>
        <img id="mainImage" alt="CHS Graduation photo">
        <video id="mainVideo" preload="metadata" controls style="display:none; max-width:100%; max-height:72vh; object-fit:contain;"></video>
        <button class="arrow right" id="nextBtn" type="button" aria-label="Next item">&#8250;</button>
      </div>

      <div class="meta">
        <div class="counter" id="counter"></div>
        <div class="controls">
          <button class="btn" id="playBtn" type="button">Play Slideshow</button>
          <button class="btn" id="shuffleBtn" type="button">Shuffle</button>
          <button class="btn" id="fullscreenBtn" type="button">Fullscreen</button>
        </div>
      </div>
    </section>

    <aside class="side">
      <h2>Quick Jump Thumbnails</h2>
      <div class="thumbs" id="thumbs"></div>
      <p class="help">Keyboard shortcuts: Left/Right = navigate, Space = play or pause, F = fullscreen, Home/End = first or last image.</p>
    </aside>
  </div>

  <script>
    let items = []; // [{src, type: 'image'|'video'}]

    const viewer    = document.getElementById('mainImage');
    const mainVideo = document.getElementById('mainVideo');
    const counter   = document.getElementById('counter');
    const thumbs    = document.getElementById('thumbs');
    const playBtn   = document.getElementById('playBtn');
    const shuffleBtn    = document.getElementById('shuffleBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let index = 0;
    let playing = false;
    let timer = null;

    function setGalleryBackground(imageSrc) {
      if (!imageSrc) return;
      document.body.style.setProperty('--page-bg-image', `url('${imageSrc}')`);
    }

    // Load photos and videos in parallel
    Promise.all([
      fetch('chs-graduation/images.json').then(r => r.ok ? r.json() : []).catch(() => []),
      fetch('chs-graduation/videos.json').then(r => r.ok ? r.json() : []).catch(() => [])
    ]).then(([imgs, vids]) => {
      items = [
        ...imgs.map(f => ({ src: 'chs-graduation/' + f, type: 'image' })),
        ...vids.map(f => ({ src: 'chs-graduation/' + f, type: 'video' }))
      ];
      setGalleryBackground(items.find(item => item.type === 'image')?.src);
      buildThumbs();
      render();
    });

    function render() {
      if (items.length === 0) return;
      const item = items[index];

      // Stop any playing video before switching
      mainVideo.pause();

      if (item.type === 'video') {
        viewer.style.display = 'none';
        mainVideo.style.display = 'block';
        mainVideo.src = item.src;
        mainVideo.load();
        // Auto-pause slideshow when a video comes up
        if (playing) togglePlay();
        counter.textContent = `Video ${index + 1} of ${items.length}`;
      } else {
        mainVideo.style.display = 'none';
        viewer.style.display = 'block';
        viewer.src = item.src;
        viewer.alt = `CHS Graduation photo ${index + 1}`;
        counter.textContent = `Photo ${index + 1} of ${items.length}`;
      }

      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === index);
      });
    }

    function next() {
      index = (index + 1) % items.length;
      render();
    }

    function prev() {
      index = (index - 1 + items.length) % items.length;
      render();
    }

    function togglePlay() {
      playing = !playing;
      playBtn.classList.toggle('active', playing);
      playBtn.textContent = playing ? 'Pause Slideshow' : 'Play Slideshow';
      if (playing) {
        timer = setInterval(next, 2600);
      } else {
        clearInterval(timer);
      }
    }

    function shuffle() {
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = items[i];
        items[i] = items[j];
        items[j] = temp;
      }
      index = 0;
      buildThumbs();
      render();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function buildThumbs() {
      thumbs.innerHTML = '';
      items.forEach((item, thumbIndex) => {
        const button = document.createElement('button');
        button.className = item.type === 'video' ? 'thumb video-thumb' : 'thumb';
        button.type = 'button';
        button.setAttribute('aria-label', `Open ${item.type} ${thumbIndex + 1}`);

        if (item.type === 'video') {
          const vid = document.createElement('video');
          vid.src = item.src;
          vid.preload = 'metadata';
          vid.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
          const overlay = document.createElement('div');
          overlay.className = 'play-overlay';
          overlay.textContent = '\u25B6';
          button.appendChild(vid);
          button.appendChild(overlay);
        } else {
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = `CHS Graduation thumbnail ${thumbIndex + 1}`;
          button.appendChild(img);
        }

        button.addEventListener('click', () => {
          index = thumbIndex;
          render();
        });
        thumbs.appendChild(button);
      });
    }

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    playBtn.addEventListener('click', togglePlay);
    shuffleBtn.addEventListener('click', shuffle);
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') next();
      if (event.key === 'ArrowLeft') prev();
      if (event.key === 'Home') { index = 0; render(); }
      if (event.key === 'End')  { index = items.length - 1; render(); }
      if (event.key === 'f' || event.key === 'F') toggleFullscreen();
      if (event.code === 'Space') {
        event.preventDefault();
        // Space plays/pauses video if one is active, otherwise toggles slideshow
        if (items[index] && items[index].type === 'video') {
          mainVideo.paused ? mainVideo.play() : mainVideo.pause();
        } else {
          togglePlay();
        }
      }
    });
  </script>
</body>
</html>
