<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KultureKool 2026 Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5ef;
      --ink: #221f18;
      --panel: #ffffff;
      --accent: #99631d;
      --accent-2: #6b4910;
      --muted: #5f5547;
      --ring: rgba(153, 99, 29, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(153, 99, 29, 0.2), transparent 35%),
        radial-gradient(circle at 92% 85%, rgba(51, 107, 94, 0.2), transparent 37%),
        linear-gradient(140deg, #fbf9f3, var(--bg));
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--page-bg-image, none) center/cover no-repeat;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

    .main {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 42px rgba(33, 26, 13, 0.12);
      backdrop-filter: blur(4px);
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .chip {
      border: 1px solid #e6d8c0;
      color: var(--ink);
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .chip:hover, .chip:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    h1 {
      margin: 8px 0 8px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 3.1vw, 2.4rem);
      color: var(--accent-2);
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.5;
    }

    .viewer-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #191611;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-wrap img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      display: block;
    }

    .viewer-wrap video {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      display: none;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: rgba(29, 22, 12, 0.72);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .arrow:hover { background: rgba(29, 22, 12, 0.92); }
    .arrow.left  { left: 10px; }
    .arrow.right { right: 10px; }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .counter {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: 1px solid #e6d8c0;
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .btn:hover, .btn:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    .btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .side {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 18px 42px rgba(33, 26, 13, 0.12);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(4px);
    }

    .side h2 {
      margin: 6px 0 10px;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow: auto;
      padding-right: 4px;
    }

    .thumb {
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      padding: 0;
      background: #f0e8d5;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    .thumb img, .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--ring);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      background: rgba(0,0,0,0.38);
      pointer-events: none;
      border-radius: 6px;
    }

    .help {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      .thumbs { grid-template-columns: repeat(6, 1fr); }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .main, .side { border-radius: 14px; }
      .thumbs { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="main">
      <nav class="top-nav" aria-label="Event navigation">
        <a class="chip" href="index.html">All People</a>
        <a class="chip" href="sridhruthi.html">Sridhruthi's Events</a>
        <a class="chip" href="chs-graduation.html">← CHS Graduation</a>
        <a class="chip" href="birthday.html">Birthday Memories →</a>
      </nav>

      <h1>KultureKool 2026</h1>
      <p class="subtitle">Full-screen viewer, thumbnail rail, slideshow mode, and keyboard navigation.</p>

      <div class="viewer-wrap">
        <button class="arrow left"  id="prevBtn" type="button" aria-label="Previous item">&#8249;</button>
        <img   id="mainImage" alt="KultureKool 2026 photo">
        <video id="mainVideo" preload="metadata" controls></video>
        <button class="arrow right" id="nextBtn" type="button" aria-label="Next item">&#8250;</button>
      </div>

      <div class="meta">
        <div class="counter" id="counter"></div>
        <div class="controls">
          <button class="btn" id="playBtn"       type="button">Play Slideshow</button>
          <button class="btn" id="shuffleBtn"    type="button">Shuffle</button>
          <button class="btn" id="fullscreenBtn" type="button">Fullscreen</button>
        </div>
      </div>
    </section>

    <aside class="side">
      <h2>Quick Jump Thumbnails</h2>
      <div class="thumbs" id="thumbs"></div>
      <p class="help">Keyboard: Left/Right = navigate &nbsp;·&nbsp; Space = play/pause &nbsp;·&nbsp; F = fullscreen &nbsp;·&nbsp; Home/End = first/last</p>
    </aside>
  </div>

  <script>
    let items = [];

    const viewer      = document.getElementById('mainImage');
    const mainVideo   = document.getElementById('mainVideo');
    const counter     = document.getElementById('counter');
    const thumbs      = document.getElementById('thumbs');
    const playBtn     = document.getElementById('playBtn');
    const shuffleBtn  = document.getElementById('shuffleBtn');
    const fsBtn       = document.getElementById('fullscreenBtn');
    const prevBtn     = document.getElementById('prevBtn');
    const nextBtn     = document.getElementById('nextBtn');

    let index = 0, playing = false, timer = null;

    function setGalleryBackground(imageSrc) {
      if (!imageSrc) return;
      document.body.style.setProperty('--page-bg-image', `url('${imageSrc}')`);
    }

    Promise.all([
      fetch('kulturekool-2026/images.json').then(r => r.ok ? r.json() : []).catch(() => []),
      fetch('kulturekool-2026/videos.json').then(r => r.ok ? r.json() : []).catch(() => [])
    ]).then(([imgs, vids]) => {
      items = [
        ...imgs.map(f => ({ src: 'kulturekool-2026/' + f, type: 'image' })),
        ...vids.map(f => ({ src: 'kulturekool-2026/' + f, type: 'video' }))
      ];
      setGalleryBackground(items.find(item => item.type === 'image')?.src);
      if (items.length === 0) {
        counter.textContent = 'No photos yet — add images to kulturekool-2026/images.json';
        return;
      }
      buildThumbs();
      render();
    });

    function render() {
      if (!items.length) return;
      const item = items[index];
      mainVideo.pause();

      if (item.type === 'video') {
        viewer.style.display = 'none';
        mainVideo.style.display = 'block';
        mainVideo.src = item.src;
        mainVideo.load();
        if (playing) togglePlay();
        counter.textContent = `Video ${index + 1} of ${items.length}`;
      } else {
        mainVideo.style.display = 'none';
        viewer.style.display = 'block';
        viewer.src = item.src;
        viewer.alt = `KultureKool 2026 photo ${index + 1}`;
        counter.textContent = `Photo ${index + 1} of ${items.length}`;
      }

      document.querySelectorAll('.thumb').forEach((t, i) =>
        t.classList.toggle('active', i === index));
    }

    function next() { index = (index + 1) % items.length; render(); }
    function prev() { index = (index - 1 + items.length) % items.length; render(); }

    function togglePlay() {
      playing = !playing;
      playBtn.classList.toggle('active', playing);
      playBtn.textContent = playing ? 'Pause Slideshow' : 'Play Slideshow';
      playing ? (timer = setInterval(next, 2600)) : clearInterval(timer);
    }

    function shuffle() {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      index = 0; buildThumbs(); render();
    }

    function toggleFullscreen() {
      document.fullscreenElement
        ? document.exitFullscreen()
        : document.documentElement.requestFullscreen();
    }

    function buildThumbs() {
      thumbs.innerHTML = '';
      items.forEach((item, i) => {
        const btn = document.createElement('button');
        btn.className = 'thumb' + (item.type === 'video' ? ' video-thumb' : '');
        btn.type = 'button';
        btn.setAttribute('aria-label', `Open ${item.type} ${i + 1}`);

        if (item.type === 'video') {
          const vid = document.createElement('video');
          vid.src = item.src; vid.preload = 'metadata';
          vid.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
          const ov = document.createElement('div');
          ov.className = 'play-overlay'; ov.textContent = '▶';
          btn.append(vid, ov);
        } else {
          const img = document.createElement('img');
          img.src = item.src; img.alt = `KultureKool thumbnail ${i + 1}`;
          btn.appendChild(img);
        }

        btn.addEventListener('click', () => { index = i; render(); });
        thumbs.appendChild(btn);
      });
    }

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    playBtn.addEventListener('click', togglePlay);
    shuffleBtn.addEventListener('click', shuffle);
    fsBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'Home') { index = 0; render(); }
      if (e.key === 'End')  { index = items.length - 1; render(); }
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.code === 'Space') {
        e.preventDefault();
        items[index]?.type === 'video'
          ? (mainVideo.paused ? mainVideo.play() : mainVideo.pause())
          : togglePlay();
      }
    });
  </script>
</body>
</html>
