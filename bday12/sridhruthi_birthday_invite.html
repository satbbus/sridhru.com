<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sridhruthi's Birthday Invite</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: 'Cormorant Garamond', serif;
  }

  .card {
    background: #000;
    border: 2px solid #e8a0b4;
    max-width: 460px;
    width: 100%;
    padding: 3rem 2.5rem 2.5rem;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 80px rgba(232,160,180,0.15),
      0 0 160px rgba(232,160,180,0.06),
      inset 0 0 80px rgba(232,160,180,0.03);
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 0.5px solid rgba(232,160,180,0.2);
    pointer-events: none;
    z-index: 1;
  }

  /* ── Butterflies ── */
  .butterfly {
    position: absolute;
    opacity: 0;
    animation: fadeIn 0.6s forwards, flutter 3.8s ease-in-out infinite;
  }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes flutter {
    0%,100% { transform: rotate(-10deg) scale(1); }
    50%      { transform: rotate(10deg)  scale(1.1); }
  }

  .b1  { top:12px;  left:18px;   width:48px; animation-delay:0s,   0.2s; animation-duration:0.6s,3.2s; }
  .b2  { top:52px;  left:68px;   width:34px; animation-delay:0.3s, 0.4s; animation-duration:0.6s,3.8s; }
  .b3  { top:18px;  right:22px;  width:30px; animation-delay:0.5s, 0.5s; animation-duration:0.6s,4.1s; }
  .b4  { top:64px;  right:58px;  width:40px; animation-delay:0.7s, 0.3s; animation-duration:0.6s,3.5s; }
  .b5  { top:6px;   left:46%;    width:26px; animation-delay:0.9s, 0.4s; animation-duration:0.6s,3.9s; }
  .b6  { bottom:44px; left:14px; width:50px; animation-delay:0.2s, 0.5s; animation-duration:0.6s,3.4s; }
  .b7  { bottom:80px; left:62px; width:32px; animation-delay:0.6s, 0.3s; animation-duration:0.6s,4.3s; }
  .b8  { bottom:22px; right:24px;width:38px; animation-delay:1.0s, 0.4s; animation-duration:0.6s,3.7s; }
  .b9  { bottom:60px; right:68px;width:28px; animation-delay:0.4s, 0.6s; animation-duration:0.6s,4.0s; }
  .b10 { top:38%;  left:5px;    width:24px; animation-delay:1.2s, 0.4s; animation-duration:0.6s,3.6s; }
  .b11 { top:42%;  right:4px;   width:22px; animation-delay:0.8s, 0.5s; animation-duration:0.6s,4.2s; }

  /* ── Sparkles ── */
  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: #e8a0b4;
    animation: sparkle 2.4s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%,100% { opacity:0.12; transform:scale(1); }
    50%      { opacity:0.55; transform:scale(1.8); }
  }
  .sp1 { width:3px;height:3px;top:38%;left:7%;   animation-delay:0s;   }
  .sp2 { width:2px;height:2px;top:58%;right:9%;  animation-delay:0.6s; }
  .sp3 { width:3px;height:3px;top:28%;right:7%;  animation-delay:1.2s; }
  .sp4 { width:2px;height:2px;top:72%;left:11%;  animation-delay:0.4s; }
  .sp5 { width:2px;height:2px;top:82%;right:14%; animation-delay:1.0s; }
  .sp6 { width:3px;height:3px;top:18%;left:30%;  animation-delay:0.8s; }

  /* ── Content ── */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-top: 70px;
    margin-bottom: 60px;
  }

  .tag {
    font-size: 11px;
    letter-spacing: 0.38em;
    color: #e8a0b4;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .logo-box {
    display: inline-block;
    border: 2px solid #e8a0b4;
    padding: 7px 24px;
    margin-bottom: 1.6rem;
    box-shadow: 0 0 20px rgba(232,160,180,0.2);
  }

  .logo-text {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 24px;
    color: #e8a0b4;
    letter-spacing: 0.06em;
  }

  .birthday-label {
    font-size: 12px;
    letter-spacing: 0.32em;
    color: rgba(232,160,180,0.65);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .name {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 30px;
    color: #fff;
    margin-bottom: 0.35rem;
    line-height: 1.25;
    text-shadow: 0 0 40px rgba(232,160,180,0.35);
  }

  .turning {
    font-size: 15px;
    letter-spacing: 0.2em;
    color: #e8a0b4;
    margin-bottom: 2rem;
    font-style: italic;
  }

  .divider {
    width: 70px;
    height: 1px;
    background: linear-gradient(to right, transparent, #e8a0b4, transparent);
    margin: 0 auto 1.8rem;
  }

  .details {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    margin-bottom: 1.8rem;
  }

  .detail-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 10px;
  }

  .detail-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .detail-inner { text-align: left; }

  .detail-label {
    font-size: 10px;
    letter-spacing: 0.28em;
    color: #e8a0b4;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .detail-value {
    font-size: 15px;
    color: #fff;
    font-style: italic;
    line-height: 1.4;
  }

  .dress-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(232,160,180,0.4);
    padding: 6px 18px;
    margin: 0.5rem 0 1.5rem;
  }

  .dress-badge span {
    font-size: 12px;
    letter-spacing: 0.22em;
    color: #e8a0b4;
    text-transform: uppercase;
  }

  .footer {
    font-size: 13px;
    color: rgba(232,160,180,0.6);
    letter-spacing: 0.14em;
    font-style: italic;
  }

  /* print-friendly */
  @media print {
    body { background: #000; }
    .butterfly { animation: none; opacity: 1; }
    .sparkle   { animation: none; opacity: 0.4; }
  }
</style>
</head>
