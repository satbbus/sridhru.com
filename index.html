<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Special Moments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1714;
      --muted: #5a504a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Manrope', sans-serif;
      color: #fff;
      background: #111;
      display: flex;
      flex-direction: column;
    }

    /* ── SPLIT LAYOUT ── */
    .split {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    .panel {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      text-decoration: none;
      color: #fff;
      transition: flex 420ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .split:has(.panel:first-child:hover) .panel:last-child,
    .split:has(.panel:first-child:focus-visible) .panel:last-child {
      flex: 0.6;
    }

    .split:has(.panel:last-child:hover) .panel:first-child,
    .split:has(.panel:last-child:focus-visible) .panel:first-child {
      flex: 0.6;
    }

    .panel:hover,
    .panel:focus-visible {
      flex: 1.4;
      outline: none;
    }

    /* background images / gradients */
    .panel-sridhruthi {
      background:
        linear-gradient(to top,
          rgba(10, 5, 30, 0.95) 0%,
          rgba(30, 15, 60, 0.6) 40%,
          rgba(40, 20, 80, 0.3) 70%,
          transparent 100%),
        url('photos/invite11.png') center/cover no-repeat;
    }

    .panel-sridhruva {
      background:
        linear-gradient(to top,
          rgba(5, 20, 25, 0.95) 0%,
          rgba(10, 50, 60, 0.6) 40%,
          rgba(10, 60, 70, 0.3) 70%,
          transparent 100%),
        url('photos/birthday-10.jpg') center/cover no-repeat;
    }

    /* divider line */
    .split::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.18);
      z-index: 10;
      pointer-events: none;
    }

    .panel-body {
      position: relative;
      z-index: 2;
      padding: 36px 40px 48px;
      width: 100%;
    }

    .panel-tag {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 10px;
    }

    .panel-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 4.8vw, 5rem);
      line-height: 0.95;
      margin-bottom: 14px;
    }

    .panel-desc {
      font-size: 0.96rem;
      line-height: 1.55;
      opacity: 0.88;
      max-width: 34ch;
      margin-bottom: 22px;
    }

    .panel-cta {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 11px 20px;
      backdrop-filter: blur(6px);
      transition: background 200ms, border-color 200ms;
    }

    .panel:hover .panel-cta,
    .panel:focus-visible .panel-cta {
      background: rgba(255, 255, 255, 0.26);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .panel-cta svg {
      flex-shrink: 0;
      transition: transform 200ms;
    }

    .panel:hover .panel-cta svg,
    .panel:focus-visible .panel-cta svg {
      transform: translateX(3px);
    }

    /* accent colour bars */
    .panel-sridhruthi .panel-body::before {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background: #d97ef0;
      margin-bottom: 18px;
    }

    .panel-sridhruva .panel-body::before {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background: #56d4c8;
      margin-bottom: 18px;
    }

    /* ── MOBILE: stack vertically ── */
    @media (max-width: 680px) {
      .split {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .split::after { display: none; }

      .panel { min-height: 50vh; }

      .panel-body {
        padding: 28px 24px 36px;
      }

      .panel-name {
        font-size: clamp(2.2rem, 9vw, 3.2rem);
      }
    }
  </style>
</head>
<body>
  <div class="split">
    <a class="panel panel-sridhruthi" href="sridhruthi.html" aria-label="View Sridhruthi's events">
      <div class="panel-body">
        <div class="panel-tag">Her Story</div>
        <h1 class="panel-name">Sridhruthi</h1>
        <p class="panel-desc">Birthdays, graduations, performances &amp; more — every milestone captured and celebrated.</p>
        <span class="panel-cta">
          View Events
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </a>

    <a class="panel panel-sridhruva" href="sridhruva.html" aria-label="View Sridhruva's events">
      <div class="panel-body">
        <div class="panel-tag">His Story</div>
        <h1 class="panel-name">Sridhruva</h1>
        <p class="panel-desc">Adventures, achievements &amp; cherished moments — his journey beautifully preserved.</p>
        <span class="panel-cta">
          View Events
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </a>
  </div>
</body>
</html>
